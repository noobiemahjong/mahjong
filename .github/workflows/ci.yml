name: CI

on: [push, pull_request]

jobs:
  build-test-gate:
    name: build / test / doc-gate / git-hooks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Restore
        run: dotnet restore Mahjong.sln

      - name: Build
        run: dotnet build Mahjong.sln --no-restore -c Release -warnaserror

      - name: Test
        run: dotnet test Mahjong.sln --no-build -c Release

      - name: Configure commit-msg hook path
        run: git config core.hooksPath tools/git-hooks

      - name: Doc gate
        run: pwsh -NoProfile -File tools/doc-gate/doc-gate.ps1 -Fail

      - name: Commit-msg hook tests
        run: pwsh -NoProfile -File tools/git-hooks/tests/run.ps1
